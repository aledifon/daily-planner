<div class="app-layout">

  <header class="header">  
    <div class="app-logo">
      <span> Daily Planner </span>
    </div>

    @if(authService.isAuthenticated()) {
      <button class="logout-button" (click)="logout()">
        Logout
      </button>
    }    

  </header>

  <main class="page-content">
    <div class="container">
      @if(authService.currentUser(); as user) {
        <h1>Hi {{user.name}}! Welcome again :-)!</h1>
      }
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="footer">
    <span class="desktop-footer-name">
      &copy; 2026 Alejandro Diaz Fontalva
    </span>
  </footer>

</div>
